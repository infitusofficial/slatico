name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean workspace build artifacts
        run: pnpm clean

      - name: Validate SVG icon sources
        run: pnpm icons:validate

      - name: Generate icon catalog and components
        run: pnpm icons:generate

      - name: Build workspace packages (dependency-ordered declarations & bundles)
        run: pnpm build:packages

      - name: Run linter
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build technical website
        run: pnpm build:website

  flutter:
    name: Validate & Test Flutter Package (slatico_icons)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Node dependencies and generate Flutter artifacts
        run: |
          pnpm install --frozen-lockfile
          pnpm icons:generate

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter package dependencies
        working-directory: packages/flutter
        run: flutter pub get

      - name: Verify Dart formatting
        working-directory: packages/flutter
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyzer
        working-directory: packages/flutter
        run: flutter analyze

      - name: Run Flutter unit and widget tests
        working-directory: packages/flutter
        run: flutter test

      - name: Verify pub.dev dry-run publishing readiness
        working-directory: packages/flutter
        run: flutter pub publish --dry-run

      - name: Compile Flutter example application for Web
        working-directory: packages/flutter/example
        run: |
          flutter pub get
          flutter build web

  android:
    name: Validate & Build Android Native Library (com.infitus.slatico)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Node dependencies and generate Android VectorDrawables & Kotlin sources
        run: |
          pnpm install --frozen-lockfile
          pnpm icons:generate

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android Library AAR, Run Unit Tests, Compile Sample App & Verify POM Metadata
        working-directory: packages/android
        run: |
          chmod +x gradlew
          ./gradlew :library:assembleRelease :library:testDebugUnitTest :sample:assembleDebug :library:generatePomFileForReleasePublication --stacktrace
          test -s library/build/outputs/aar/library-release.aar
          test -s sample/build/outputs/apk/debug/sample-debug.apk

  swift:
    name: Validate, Build & Test Apple Swift Package (SlaticoIcons)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Node dependencies and generate Swift package artifacts
        run: |
          pnpm install --frozen-lockfile
          pnpm icons:generate

      - name: Verify Swift and Xcode toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Validate Swift Package.swift manifest
        working-directory: packages/swift
        run: swift package dump-package > /dev/null

      - name: Build Swift package targets on macOS (SwiftUI + AppKit)
        working-directory: packages/swift
        run: swift build -v

      - name: Run XCTest suite on macOS (161 CGPaths, Bundle.module SVGs, AppKit & SwiftUI)
        working-directory: packages/swift
        run: swift test -v

      - name: Cross-compile Swift package for iOS Simulator (SwiftUI + UIKit)
        working-directory: packages/swift
        run: |
          xcodebuild -list
          xcodebuild build \
            -scheme SlaticoIcons \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -scheme SlaticoIconsExample \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

