apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.infitus.slatico.rnexample"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.infitus.slatico.rnexample"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets {
        main {
            assets.srcDirs += ["../../dist/android"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ["**/libc++_shared.so", "**/libfbjni.so", "**/libjsi.so"]
        }
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.facebook.react:react-android:0.79.2")
    implementation("com.facebook.react:hermes-android:0.79.2")
    implementation(project(":react-native-svg"))

    testImplementation("junit:junit:4.13.2")
}
